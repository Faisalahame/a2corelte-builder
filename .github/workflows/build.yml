name: Build LineageOS 17.1 for a2corelte

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
          sudo apt clean
          df -h

      - name: Fix swap
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 openjdk-8-jdk ccache schedtool bc gperf imagemagick lib32readline-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 lzop pngcrush rsync squashfs-tools

      - name: Setup Git
        run: |
          git config --global user.name "Faisalahame"
          git config --global user.email "ahamedfaisal00008@gmail.com"

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize LineageOS 17.1
        run: |
          mkdir workspace
          cd workspace
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1

      - name: Clone ALL device trees and hardware
        run: |
          cd workspace
          mkdir -p device/samsung/a2corelte
          git clone https://github.com/Faisalahame/android_device_samsung_a2corelte.git -b lineage-17.1 device/samsung/a2corelte
          mkdir -p device/samsung/exynos7870-common
          git clone https://github.com/Faisalahame/android_device_samsung_exynos7870-common.git device/samsung/exynos7870-common
          mkdir -p vendor/samsung/a2corelte
          git clone https://github.com/Faisalahame/android_vendor_samsung_a2corelte.git vendor/samsung/a2corelte
          mkdir -p kernel/samsung/exynos7870
          git clone https://github.com/Faisalahame/android_kernel_samsung_exynos7870.git kernel/samsung/exynos7870
          mkdir -p hardware/samsung_slsi-cm/exynos5
          git clone https://github.com/Faisalahame/android_hardware_samsung_slsi-cm_exynos5.git hardware/samsung_slsi-cm/exynos5
          mkdir -p hardware/samsung_slsi-cm/exynos
          git clone https://github.com/Faisalahame/android_hardware_samsung_slsi-cm_exynos.git hardware/samsung_slsi-cm/exynos
          mkdir -p hardware/samsung_slsi-cm/openmax
          git clone https://github.com/Faisalahame/android_hardware_samsung_slsi-cm_openmax.git hardware/samsung_slsi-cm/openmax
          mkdir -p hardware/samsung_slsi-cm/exynos7870
          git clone https://github.com/Exynos7870/android_hardware_samsung_slsi-cm_exynos7870.git -b lineage-16.0 hardware/samsung_slsi-cm/exynos7870
          mkdir -p hardware/samsung
          git clone https://github.com/LineageOS/android_hardware_samsung.git -b lineage-17.1 hardware/samsung

      - name: Sync source code (with auto-retry)
        run: |
          cd workspace
          for i in {1..5}; do
            repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags && break
            echo "Server/Network error during sync. Retrying in 30 seconds... (Attempt $i)"
            sleep 30
          done

      - name: Patch obsolete variables
        run: |
          cd workspace
          find device/samsung -type f -name "*.mk" -exec sed -i 's/$(ANDROID_BUILD_TOP)/./g' {} +
          find device/samsung -type f -name "*.mk" -exec sed -i 's/ANDROID_BUILD_TOP/./g' {} +

      - name: Fix Error 10 (Missing init file)
        run: |
          cd workspace
          mkdir -p device/samsung/a2corelte/init
          echo "#include <string>" > device/samsung/a2corelte/init/init_a2corelte.cpp
          echo "void vendor_load_properties() {}" >> device/samsung/a2corelte/init/init_a2corelte.cpp
      - name: Fix Error 11 (Obsolete Module Tags)
        run: |
          cd workspace
          find hardware -type f -name "Android.mk" -exec sed -i "/LOCAL_MODULE_TAGS :=/d" {} +
      - name: Build LineageOS 17.1
        run: |
          cd workspace
          source build/envsetup.sh
          breakfast a2corelte
          mka bacon -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-17.1-a2corelte
          path: workspace/out/target/product/a2corelte/lineage-*.zip

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            workspace/out/verbose.log.gz
            workspace/out/soong.log
            workspace/out/build.log
            workspace/out/error.log
          retention-days: 5
