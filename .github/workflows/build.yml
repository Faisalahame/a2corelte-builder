name: Build LineageOS for a2corelte

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost $AGENT_TOOLSDIRECTORY
          sudo docker image prune -af

      - name: Add Swap Space
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 openjdk-17-jdk ccache

      - name: Setup Git
        run: |
          git config --global user.name "Faisalahame"
          git config --global user.email "ahamedfaisal00008@gmail.com"

      - name: Initialize Repo
        run: |
          mkdir workspace
          cd workspace
          repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --depth=1

      - name: Clone YOUR Trees
        run: |
          cd workspace
          mkdir -p device/samsung/a2corelte
          git clone https://github.com/Faisalahame/android_device_samsung_a2corelte.git device/samsung/a2corelte
          mkdir -p vendor/samsung/a2corelte
          git clone https://github.com/Faisalahame/android_vendor_samsung_a2corelte.git vendor/samsung/a2corelte
          mkdir -p kernel/samsung/exynos7870
          git clone https://github.com/Faisalahame/android_kernel_samsung_exynos7870.git kernel/samsung/exynos7870

      - name: Sync Source
        run: |
          cd workspace
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

      - name: Build ROM
        run: |
          cd workspace
          source build/envsetup.sh
          breakfast a2corelte
          mka bacon -j$(nproc)

      - name: Upload ROM Zip
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-a2corelte-Unofficial
          path: workspace/out/target/product/a2corelte/lineage-*.zip
